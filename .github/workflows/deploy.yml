name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    needs: []  # runs after CI passes (branch protection enforces ci.yml)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Deploy to Railway
        run: railway up --service backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  notify-deploy:
    name: Notify Deploy Status
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    if: always()

    steps:
      - name: Deploy success
        if: needs.deploy-backend.result == 'success'
        run: echo "✅ Backend deployed successfully to Railway"

      - name: Deploy failure
        if: needs.deploy-backend.result == 'failure'
        run: |
          echo "❌ Deploy failed. Check Railway logs."
          exit 1
